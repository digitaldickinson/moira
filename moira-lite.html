                    return `<tr class="segment-row" data-story-id="${id}" draggable="true">
                        <td colspan="10">
                            <div class="segment-divider">
                                <div class="segment-label"><i class="fa-solid fa-scissors mr-2 opacity-40"></i>${escapeHTML(story.slug)}</div>
                                ${durLabel ? `<span class="segment-dur">${durLabel}</span>` : ''}
                                <div class="segment-line"></div>
                                <div class="flex items-center gap-1 px-2">
                                    <button data-action="edit-story" data-id="${id}" class="p-1.5 text-indigo-300 hover:text-indigo-700 transition-colors"><i class="fa-solid fa-pen text-xs"></i></button>
                                    ${!isRundownLocked ? `<button data-action="delete-story" data-id="${id}" class="p-1.5 text-indigo-300 hover:text-red-500 transition-colors"><i class="fa-solid fa-trash text-xs"></i></button>` : ''}
                                </div>
                            </div>
                        </td>
                    </tr>`;
                }

                if (!isBelowLine && !story.isFloated) totalDuration += story.duration || 0;
                const isActive = state.meta.activeStoryId === id && state.meta.isTXMode;
                const isComplete = story.completed;
                const isLocked = story.lockedBySession && story.lockedBySession !== state.sessionId;

                let rowClasses = 'border-b border-slate-200 transition-colors ';
                if (isBelowLine) rowClasses += 'bg-slate-100 opacity-80 ';
                else if (isActive) rowClasses += state.meta.isTXMode ? 'bg-red-50 border-l-4 border-l-red-500 ' : 'bg-amber-50 border-l-4 border-l-amber-500 ';
                else if (story.mediaFile) rowClasses += 'bg-yellow-50 hover:bg-yellow-100 ';
                else rowClasses += 'bg-white hover:bg-slate-50 ';
                if (story.isFloated && !isBelowLine) rowClasses += 'opacity-50 ';

                const pres = (state.meta.staff || []).find(s => s.id === story.presenterId)?.name || '';
                const rep = (state.meta.staff || []).find(s => s.id === story.reporterId)?.name || '';

                let clockCell = '<td class="px-3 py-1.5 text-xs font-mono text-slate-400 w-20">--:--:--</td>';
                if (!isBelowLine && txSecs !== null && !story.isFloated) {
                    const storyClock = txSecs + (storyStartTimes[id] || 0);
                    clockCell = `<td class="px-3 py-1.5 text-xs font-mono text-slate-600 w-20 font-bold">${formatClockTime(storyClock)}</td>`;
                } else if (!isBelowLine && story.isFloated) {
                    clockCell = `<td class="px-3 py-1.5 text-xs font-mono text-slate-300 w-20 line-through">floated</td>`;
                }

                return `<tr class="${rowClasses}" data-story-id="${id}" draggable="true">
                    <td class="px-3 py-1.5 text-center w-10 ${(isRundownLocked || isLocked) ? 'text-slate-200 cursor-not-allowed' : 'text-slate-400 cursor-grab active:cursor-grabbing hover:text-blue-500'}" title="${isLocked ? `Locked by ${escapeHTML(story.lockedByName)}` : ''}">
                        <i class="row-drag-icon fa-solid fa-grip-vertical"></i>
                        ${!isRundownLocked && !isLocked ? `<div class="row-reorder-btns">
                            <button data-action="move-story-up"   data-id="${id}" class="text-slate-400 hover:text-blue-500 text-xs leading-none py-0.5 px-1" ${idx === 0 ? 'disabled' : ''}>▲</button>
                            <button data-action="move-story-down" data-id="${id}" class="text-slate-400 hover:text-blue-500 text-xs leading-none py-0.5 px-1" ${idx === (state.meta.order||[]).length - 1 ? 'disabled' : ''}>▼</button>
                        </div>` : ''}
                    </td>
                    <td class="px-3 py-1.5 font-semibold w-1/4">
                        ${isActive ? `<span class="inline-block w-2 h-2 ${state.meta.isTXMode ? 'bg-red-500' : 'bg-amber-400'} rounded-full animate-pulse mr-2"></span>` : ''}
                        ${story.mediaFile ? '<i class="fa-solid fa-photo-film text-amber-500 mr-2"></i>' : ''}
                        <span data-action="inline-edit-slug" data-id="${id}" class="inline-block cursor-text hover:bg-slate-100/50 px-1 -mx-1 rounded transition-colors" title="Click to edit slug in place">
                            ${escapeHTML(story.slug)}
                        </span>
                        ${isLocked ? '<i class="fa-solid fa-lock text-red-500 ml-2"></i>' : ''}
                        ${story.isFloated ? `<span class="ml-2 text-[10px] font-bold bg-amber-100 text-amber-700 border border-amber-200 px-1.5 py-0.5 rounded uppercase tracking-wide">Floated</span>` : ''}
                    </td>
                    <td class="px-3 py-1.5 text-sm w-24"><span class="bg-slate-100 border px-2 py-0.5 rounded text-xs font-mono font-bold">${escapeHTML(story.format)}</span></td>
                    <td class="px-3 py-1.5 w-32"><div class="text-xs font-bold text-blue-700">${escapeHTML(rep)}</div><div class="text-xs text-slate-600">${escapeHTML(pres)}</div></td>
                    <td class="px-3 py-1.5 text-sm w-24 font-mono">${story.isFloated ? `<span class="line-through text-slate-400">${formatDuration(story.duration)}</span>` : formatDuration(story.duration)}</td>
                    ${clockCell}
                    <td class="px-3 py-1.5 text-sm italic truncate max-w-xs">${escapeHTML(story.script || 'No script...')}</td>
                    <td class="px-3 py-1.5 text-center w-16">
                        ${(()=>{
                            const cs = story.completed;
                            const colour = (!cs || cs === false || cs === null) ? 'text-slate-300'
                                : cs === 'needs-checking' ? 'text-yellow-500'
                                : cs === 'checked-ok' ? 'text-emerald-500'
                                : 'text-red-500';
                            const title = (!cs || cs === false || cs === null) ? 'Not checked — click to flag'
                                : cs === 'needs-checking' ? 'Needs checking — click to approve'
                                : cs === 'checked-ok' ? 'Checked OK — click to flag issue'
                                : 'Needs work — click to clear';
                            return `<button data-action="toggle-complete" data-id="${id}" class="text-lg ${colour} transition-colors" title="${title}"><i class="fa-solid fa-circle"></i></button>`;
                        })()}
                    </td>
                    <td class="px-3 py-1.5 text-center w-16">
                        <button data-action="toggle-float" data-id="${id}" class="text-lg ${story.isFloated ? 'text-amber-500' : 'text-slate-300'} transition-colors" title="${story.isFloated ? 'Un-float story' : 'Float story'}">
                            <i class="fa-solid fa-circle-pause"></i>
                        </button>
                    </td>
                    <td class="px-3 py-1.5 text-right w-20">
                        <button data-action="edit-story" data-id="${id}"
                            class="p-1.5 ${isLocked ? 'text-slate-200 cursor-not-allowed' : 'text-slate-400 hover:text-blue-600'} transition-colors"
                            ${isLocked ? `disabled title="Locked by ${escapeHTML(story.lockedByName)}"` : ''}><i class="fa-solid fa-pen text-xs"></i></button>
                        ${!isRundownLocked ? `<button data-action="delete-story" data-id="${id}" class="p-1.5 text-slate-400 hover:text-red-600"><i class="fa-solid fa-trash text-xs"></i></button>` : ''}
                    </td>
                </tr>`;
            }).join('');

            const txRxBar = `
                <div class="flex flex-wrap gap-y-2 items-center gap-6 bg-slate-100 border border-slate-200 text-slate-700 px-6 py-3 rounded-xl mb-4">
                    <span class="text-xs font-black uppercase tracking-widest text-slate-400">Timing</span>
                    <div class="flex items-center gap-2">
                        <label class="text-xs font-bold uppercase tracking-wide text-slate-500">TX</label>
                        <input type="text" id="tx-clock-input" value="${escapeHTML(state.meta.txClockTime || '')}" 
                            placeholder="18:00:00"
                            class="bg-white border border-slate-300 rounded px-3 py-1.5 text-sm font-mono text-slate-800 w-28 outline-none focus:border-blue-400 placeholder-slate-400">
                        <button data-action="save-tx-time" class="bg-white hover:bg-slate-200 border border-slate-300 text-slate-700 px-3 py-1.5 rounded text-xs font-bold transition-colors">Set</button>
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="text-xs font-bold uppercase tracking-wide text-slate-500">RX</label>
                        <input type="text" id="rx-clock-input" value="${escapeHTML(state.meta.rxClockTime || '')}" 
                            placeholder="18:28:30"
                            class="bg-white border border-slate-300 rounded px-3 py-1.5 text-sm font-mono text-slate-800 w-28 outline-none focus:border-blue-400 placeholder-slate-400">
                        <button data-action="save-rx-time" class="bg-white hover:bg-slate-200 border border-slate-300 text-slate-700 px-3 py-1.5 rounded text-xs font-bold transition-colors">Set</button>
                    </div>
                    ${txSecs !== null && rxSecs !== null ? `
                        <div class="ml-4 flex items-center gap-2 border-l border-slate-300 pl-4">
                            <span class="text-xs text-slate-500 uppercase tracking-wide">Programme</span>
                            <span class="font-mono font-bold text-slate-800">${formatDuration(rxSecs - txSecs)}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-slate-500 uppercase tracking-wide">TRT</span>
                            ${(()=>{
                                const progSecs = rxSecs - txSecs;
                                const diff = totalDuration - progSecs;
                                const absDiff = Math.abs(diff);
                                const colour = diff > 0 ? 'text-red-500' : absDiff <= 30 ? 'text-amber-500' : 'text-emerald-600';
                                const sign = diff > 0 ? '+' : '−';
                                const label = diff === 0 ? formatDuration(totalDuration) : `${formatDuration(totalDuration)} <span class="text-sm font-normal">(${sign}${formatDuration(absDiff)})</span>`;
                                return `<span class="font-mono font-bold ${colour}">${label}</span>`;
                            })()}
                        </div>
                    ` : ''}
                    <div class="ml-auto flex items-center gap-2">
                        ${state.meta.rundownLocked ? `<span class="flex items-center gap-1.5 text-xs font-bold px-2.5 py-1 rounded-full border ${isEditor ? 'bg-amber-50 border-amber-300 text-amber-700' : 'bg-red-50 border-red-200 text-red-600'}"><i class="fa-solid fa-lock text-xs"></i> ${isEditor ? 'You locked this' : `Locked by ${escapeHTML(editorName)}`}</span>` : ''}
                        ${isEditor ? `<button data-action="toggle-rundown-lock" class="flex items-center gap-1.5 text-xs font-bold px-2.5 py-1.5 rounded-lg border transition-colors ${state.meta.rundownLocked ? 'bg-red-100 text-red-700 border-red-200 hover:bg-red-200' : 'bg-white text-slate-500 border-slate-300 hover:border-slate-400 hover:text-slate-700'}"><i class="fa-solid ${state.meta.rundownLocked ? 'fa-lock-open' : 'fa-lock'}"></i> ${state.meta.rundownLocked ? 'Unlock' : 'Lock'}</button>` : ''}
                        ${canAlert ? `
                        <div class="relative">
                            <button data-action="toggle-alert-panel"
                                class="relative flex items-center gap-1.5 text-xs font-bold px-2.5 py-1.5 rounded-lg border transition-colors ${state.ui.alertPanelOpen ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-slate-500 border-slate-300 hover:border-amber-400 hover:text-amber-600'}"
                                title="Alert Presenter">
                                <i class="fa-solid fa-bullhorn text-sm"></i>
                                ${state.meta.presenterAlert ? `<span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white animate-pulse"></span>` : ''}
                            </button>
                            ${state.ui.alertPanelOpen ? `
                            <div class="absolute right-0 top-full mt-2 w-[min(24rem,calc(100vw-2rem))] bg-slate-800 border border-slate-600 rounded-xl shadow-2xl z-50 overflow-hidden">
                                <div class="px-4 py-3 border-b border-slate-700 flex items-center justify-between">
                                    <span class="text-xs font-black text-slate-300 uppercase tracking-widest"><i class="fa-solid fa-bullhorn text-amber-400 mr-2"></i>Alert Presenter</span>
                                    <button data-action="toggle-alert-panel" class="text-slate-500 hover:text-slate-300 text-sm transition-colors"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                                <div class="p-4 space-y-3">
                                    <textarea id="presenter-alert-input" maxlength="120" rows="2"
                                        placeholder="e.g. Hold on sport — breaking news incoming…"
                                        class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 outline-none focus:border-amber-400 font-mono resize-none"></textarea>
                                    <div class="flex gap-2">
                                        <button data-action="send-presenter-alert"
                                            class="flex-1 py-2 bg-amber-500 hover:bg-amber-400 text-slate-900 font-black text-xs rounded-lg tracking-widest uppercase transition-colors">
                                            <i class="fa-solid fa-paper-plane mr-1.5"></i>Send
                                        </button>
                                        ${state.meta.presenterAlert ? `
                                        <button data-action="clear-presenter-alert"
                                            class="px-4 py-2 bg-slate-600 hover:bg-slate-500 text-slate-300 font-bold text-xs rounded-lg transition-colors">
                                            ✕ Clear
                                        </button>` : ''}
                                    </div>
                                    ${state.meta.presenterAlert ? `
                                    <div class="flex items-center gap-2 bg-amber-900/40 border border-amber-700/50 rounded-lg px-3 py-2">
                                        <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse shrink-0"></span>
                                        <span class="text-xs font-black text-amber-400 uppercase tracking-widest shrink-0">Live</span>
                                        <span class="text-xs text-amber-200 font-mono truncate">${escapeHTML(state.meta.presenterAlert.text)}</span>
                                    </div>` : ''}
                                </div>
                            </div>` : ''}
                        </div>` : ''}
                    </div>
                </div>`;


            return `<div class="max-w-7xl mx-auto p-6 pb-24">
                <div class="flex flex-wrap gap-3 items-center justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <h2 class="text-3xl font-bold text-slate-800"><i class="fa-solid fa-bars-staggered mr-3 text-slate-400"></i>Rundown</h2>
                    </div>
                    <div class="flex flex-wrap gap-2 items-center">
                        ${state.meta.isTXMode ? `
                        <div class="flex items-center gap-3 bg-red-50 border border-red-200 px-4 py-2 rounded-xl">
                            <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                            <span class="text-xs font-black uppercase tracking-widest text-red-600">TX</span>
                            <span id="tx-timer-display" class="font-mono font-bold text-red-700">00:00</span>
                            <div class="w-px h-4 bg-red-200"></div>
                            <span class="text-xs font-bold uppercase tracking-wide text-slate-400">BT</span>
                            <span id="backtime-display" class="font-mono font-bold text-slate-600">--:--</span>
                        </div>` : ''}
                        ${txSecs === null || rxSecs === null ? `<div class="text-sm font-medium text-slate-500">Total TRT: <span class="text-slate-800 font-mono text-lg bg-slate-200 px-2 py-1 rounded ml-1">${formatDuration(totalDuration)}</span></div>` : ''}
                        <button data-action="add-story" ${isRundownLocked ? 'disabled title="Rundown is locked"' : ''} class="${isRundownLocked ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 text-white'} px-5 py-2.5 rounded-lg font-medium transition-colors shadow-sm"><i class="fa-solid fa-plus mr-2"></i>Add Story</button>
                        <button data-action="add-segment" ${isRundownLocked ? 'disabled title="Rundown is locked"' : ''} class="${isRundownLocked ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-slate-700 hover:bg-slate-600 text-white'} px-5 py-2.5 rounded-lg font-medium transition-colors shadow-sm" title="Add a segment break or theme divider"><i class="fa-solid fa-scissors mr-2"></i>Add Segment</button>
                        <button data-action="print-scripts" class="bg-slate-600 hover:bg-slate-700 text-white px-5 py-2.5 rounded-lg font-medium transition-colors shadow-sm">
                            <i class="fa-solid fa-print mr-2"></i>Print Scripts
                        </button>
                    </div>
                </div>
                ${txRxBar}
                ${state.ui.trash.length > 0 ? `
                <div class="flex items-center gap-3 bg-amber-50 border border-amber-200 text-amber-800 px-4 py-2.5 rounded-xl mb-4 text-sm">
                    <i class="fa-solid fa-trash-arrow-up text-amber-500"></i>
                    <span class="font-semibold">${state.ui.trash.length} deleted ${state.ui.trash.length === 1 ? 'story' : 'stories'} this session</span>
                    <div class="flex items-center gap-2 ml-2 flex-wrap">
                        ${state.ui.trash.map(t => `<button data-action="rescue-story" data-id="${t.id}" class="bg-amber-100 hover:bg-amber-200 border border-amber-300 text-amber-800 px-2.5 py-1 rounded-lg text-xs font-bold transition-colors"><i class="fa-solid fa-rotate-left mr-1"></i>${escapeHTML(t.story.slug)}</button>`).join('')}
                    </div>
                    <button data-action="clear-trash" class="ml-auto text-amber-400 hover:text-amber-700 text-xs font-bold px-2 py-1 rounded transition-colors" title="Discard all deleted stories">Clear</button>
                </div>` : ''}
                <div class="hidden lg:block">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase tracking-wider text-slate-500">
                                    <th class="px-4 py-3 w-10 text-center"><i class="fa-solid fa-arrows-up-down"></i></th>
                                    <th class="px-4 py-3">Slug</th>
                                    <th class="px-4 py-3">Fmt</th>
                                    <th class="px-4 py-3">Staff</th>
                                    <th class="px-4 py-3">Dur</th>
                                    <th class="px-4 py-3">Clock</th>
                                    <th class="px-4 py-3">Preview</th>
                                    <th class="px-4 py-3 text-center">Checked</th>
                                    <th class="px-4 py-3 text-center">Float</th>
                                    <th class="px-4 py-3 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="rundown-table-body">
                                ${rows}
                                <tr data-story-id="end-of-list" class="h-16 bg-transparent"><td colspan="10"></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="lg:hidden flex flex-col gap-3">
                    ${renderRundownMobileCards(state.meta.order || [])}
                </div>
            </div>`;
        }


       /**
         * Renders the Presenter view. Switches between two sub-modes:
         * - 'autocue': full-screen scrolling script view (renderAutocue)
         * - 'presenter': side-by-side reference cards (renderPresenterCards)
         * The Presenter tab button toggles between the two sub-modes when already
         * active, rather than switching away from presenter view.
         * @returns {string} HTML string.
         */
       function renderPresenter() {
            const rawOrder = state.meta.order || [];
            const markerIdx = rawOrder.indexOf('marker-line');
            const storyIds = (markerIdx > -1 ? rawOrder.slice(0, markerIdx) : rawOrder)
                .filter(id => !state.storiesMap[id]?.isFloated);

            if (storyIds.length === 0) {
                return `<div class="flex h-full items-center justify-center bg-black text-slate-600 text-3xl font-light">Standing By...</div>`;
            }

            const pm = state.ui.presenter;
            const isLive = state.meta.isTXMode;
            const isRehearsal = state.meta.isRehearsalMode;

            if (pm.presenterMode === 'autocue') {
                return renderAutocue(storyIds);
            } else {
                return renderPresenterCards(storyIds);
            }
        }

        /**
         * Renders the full-screen autocue view. Stories scroll continuously —
         * the view never jumps unless Take Next is explicitly pressed (controlled
         * via pendingScrollToActive flag). Active story is fully opaque; others
         * are dimmed. Mirror and font scale applied via CSS transform. A fixed
         * controls bar at the bottom handles scroll speed and navigation.
         * @param {string[]} storyIds - Ordered non-floated story IDs.
         * @returns {string} HTML string.
         */
        function renderAutocue(storyIds) {
            const pm = state.ui.presenter;
            const fontSize = Math.round(48 * pm.fontScale);
            const scaleX = pm.mirrorX ? -1 : 1;
            const scaleY = pm.mirrorY ? -1 : 1;
            const transformStyle = `transform: scale(${scaleX}, ${scaleY}); transform-origin: center top;`;
            const isLive = state.meta.isTXMode;
            const isRehearsal = state.meta.isRehearsalMode;
            const activeColour = isLive ? '#ef4444' : isRehearsal ? '#f59e0b' : '#3b82f6';

            const storiesHtml = storyIds.map(id => {
                const story = state.storiesMap[id];
                if (!story) return '';
                const isActive = state.meta.activeStoryId === id;

                // Segment break — show as a horizontal holding card
                if (story.type === 'segment') {
                    const durLabel = story.duration > 0 ? ` · ${formatDuration(story.duration)}` : '';
                    return `
                        <div id="presenter-story-${id}" class="mb-16">
                            <div style="border: 2px dashed #6366f1; border-radius: 0.75rem; padding: 1.25rem 1.5rem; display: flex; align-items: center; gap: 1rem; opacity: 0.6;">
                                <i class="fa-solid fa-scissors" style="color:#6366f1; font-size:1.25rem;"></i>
                                <span style="color:#6366f1; font-weight:900; font-size:1.1rem; letter-spacing:0.12em; text-transform:uppercase;">${escapeHTML(story.slug)}${durLabel}</span>
                                <div style="flex:1; height:1px; background:#6366f1; opacity:0.3;"></div>
                            </div>
                        </div>`;
                }

                const clipSecs = parseClipTags(story.script);

                return `
                    <div id="presenter-story-${id}" class="mb-16">
                        <div style="background:${isActive ? activeColour : '#1e293b'}; transition: background 0.4s;"
                            class="w-full px-6 py-3 flex items-center gap-4 rounded-lg mb-6">
                            <span class="text-white font-black text-lg tracking-widest uppercase opacity-60">${escapeHTML(story.format)}</span>
                            <span class="text-white font-black text-2xl tracking-widest uppercase">${escapeHTML(story.slug)}</span>
                            <span class="ml-auto text-white opacity-60 text-sm font-mono">${formatDuration(story.duration)}${clipSecs > 0 ? ' +' + formatDuration(clipSecs) + ' clip' : ''}</span>
                        </div>
                        <div style="font-size:${fontSize}px; line-height:1.7; opacity:${isActive ? 1 : 0.25}; transition: opacity 0.4s;"
                            class="text-white font-medium tracking-wide">
                            ${formatPresenterScript(story.script)}
                        </div>
                    </div>`;
            }).join('');

            const speed = pm.scrollSpeed;
            const activeIdx = storyIds.indexOf(state.meta.activeStoryId);
            const atFirst = activeIdx <= 0;
            const atLast = activeIdx === storyIds.length - 1;
            const btnNav = 'px-4 py-3 min-h-[48px] rounded font-black text-sm tracking-widest transition-colors';
            const btnNavOn = `${btnNav} bg-slate-700 hover:bg-slate-600 text-white`;
            const btnNavOff = `${btnNav} bg-slate-900 text-slate-700 cursor-not-allowed`;

            const controlsBar = `
                <div class="fixed bottom-0 left-0 right-0 z-50 flex items-center justify-between px-6 pt-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))] bg-black/80 backdrop-blur-sm border-t border-slate-800">
                    <div class="flex items-center gap-3">
                        <span class="text-slate-500 text-xs font-bold uppercase tracking-widest">Size</span>
                        <button data-action="presenter-font-down" class="w-11 h-11 rounded bg-slate-800 hover:bg-slate-700 text-white font-black text-lg flex items-center justify-center">−</button>
                        <span class="text-white text-xs font-mono w-8 text-center">${fontSize}</span>
                        <button data-action="presenter-font-up" class="w-11 h-11 rounded bg-slate-800 hover:bg-slate-700 text-white font-black text-lg flex items-center justify-center">+</button>
                    </div>
                    <div class="flex items-center gap-3">
                        <button data-action="presenter-story-prev" ${atFirst ? 'disabled' : ''} class="${atFirst ? btnNavOff : btnNavOn}">◀ Prev</button>
                        <button data-action="presenter-scroll-toggle"
                            class="px-6 py-3 min-h-[48px] rounded font-black text-sm tracking-widest transition-colors ${pm.autoScroll ? 'bg-white text-black hover:bg-slate-200' : 'bg-slate-700 text-white hover:bg-slate-600'}">
                            ${pm.autoScroll ? '⏸ PAUSE' : '▶ SCROLL'}
                        </button>
                        <button data-action="presenter-story-next" ${atLast ? 'disabled' : ''} class="${atLast ? btnNavOff : btnNavOn}">Next ▶</button>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-slate-500 text-xs font-bold uppercase tracking-widest">Speed</span>
                        <button data-action="presenter-speed-down" class="w-11 h-11 rounded bg-slate-800 hover:bg-slate-700 text-white font-black text-lg flex items-center justify-center">−</button>
                        <span class="text-white text-xs font-mono w-8 text-center">${speed}</span>
                        <button data-action="presenter-speed-up" class="w-11 h-11 rounded bg-slate-800 hover:bg-slate-700 text-white font-black text-lg flex items-center justify-center">+</button>
                    </div>
                </div>`;

            return `
                <div class="bg-black min-h-full overflow-hidden">
                    ${pm.zenMode ? `<div class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-black/70 text-white text-xs font-bold uppercase tracking-widest px-5 py-2 rounded-full pointer-events-none select-none">Press F or ESC to exit fullscreen</div>` : ''}
                    <div id="presenter-transform-wrapper" style="${transformStyle}"
                        class="transition-transform duration-300 pb-32">
                        <div class="px-4 max-w-[85%] sm:max-w-[75%] md:max-w-[65%] mx-auto">
                            <div class="py-[40vh]">
                                ${storiesHtml}
                            </div>
                        </div>
                    </div>
                    ${controlsBar}
                </div>`;
        }

        /**
         * Renders the presenter reference card view: a grid of story cards
         * showing slug, format, script excerpt, and staff names. The active
         * story is highlighted. Cards can be expanded to show full script.
         * @param {string[]} storyIds - Ordered non-floated story IDs.
         * @returns {string} HTML string.
         */

        /**
         * Renders a presenter script with [CLIP] tags replaced by large tap-to-fire
         * buttons. Only used in presenter cards view when self-fire is enabled.
         * Non-CLIP instruction blocks render as normal visual cues.
         * @param {string} script
         * @param {string} storyId
         * @returns {string} HTML string
         */
        function renderPresenterScriptWithFire(script, storyId) {
            if (!script) return '<p class="text-base text-slate-500 italic">No script.</p>';
            // Prefer local state; fall back to Firestore state so non-master UIs reflect
            // what the master is playing without needing a local Audio element.
            const playingId = state.ui.presenter.playingClipStoryId || state.meta.presenterClipStoryId;
            const isPlaying = playingId === storyId;

            // Split on CLIP tags to interleave text and buttons
            const parts = script.split(/(\[CLIP:\d+:\d{2}\])/gi);
            return parts.map(part => {
                const clipMatch = part.match(/^\[CLIP:(\d+):(\d{2})\]$/i);
                if (clipMatch) {
                    const mins = parseInt(clipMatch[1], 10);
                    const secs = parseInt(clipMatch[2], 10);
                    const dur  = formatDuration(mins * 60 + secs);
                    if (isPlaying) {
                        // Countdown timer — initial value is full duration; interval updates it live
                        return `<button id="presenter-clip-btn-${storyId}" data-action="presenter-fire-clip" data-id="${storyId}"
                            style="display:block; width:100%; margin:1rem 0; padding:1.1rem 1.5rem; border-radius:0.75rem;
                                   background:#dc2626; color:#fff; border:none; cursor:pointer;
                                   font-size:1.1rem; font-weight:900; letter-spacing:0.08em; text-transform:uppercase;
                                   box-shadow:0 4px 24px rgba(220,38,38,0.4);">
                            <span style="display:flex;align-items:center;justify-content:center;gap:1rem;">
                                <span style="font-size:1.4rem;">⏹</span>
                                <span>STOP CLIP</span>
                                <span id="presenter-clip-timer-${storyId}" style="opacity:0.85;font-size:1.2rem;font-weight:900;font-family:monospace;">${dur}</span>
                            </span>
                        </button>`;
                    } else {
                        return `<button id="presenter-clip-btn-${storyId}" data-action="presenter-fire-clip" data-id="${storyId}"
                            style="display:block; width:100%; margin:1rem 0; padding:1.1rem 1.5rem; border-radius:0.75rem;
                                   background:#16a34a; color:#fff; border:none; cursor:pointer;
                                   font-size:1.1rem; font-weight:900; letter-spacing:0.08em; text-transform:uppercase;
                                   box-shadow:0 4px 16px rgba(22,163,74,0.3);">
                            <span style="display:flex;align-items:center;justify-content:center;gap:1rem;">
                                <span style="font-size:1.4rem;">▶</span>
                                <span>PLAY CLIP</span>
                                <span id="presenter-clip-timer-${storyId}" style="opacity:0.7;font-size:1.1rem;font-weight:700;font-family:monospace;">${dur}</span>
                            </span>
                        </button>`;
                    }
                } else if (part.trim()) {
                    // Regular script text — preserve line breaks
                    const escaped = escapeHTML(part).replace(/\n/g, '<br>');
                    // Render [INSTRUCTION] blocks
                    const formatted = escaped.replace(/\[([^\]]+)\]/g,
                        '<span style="display:inline-block;background:#e2e8f0;color:#1e293b;padding:0.15rem 0.6rem;border-radius:0.375rem;font-size:0.75em;font-weight:900;text-transform:uppercase;letter-spacing:0.05em;margin:0 0.2rem;">[$1]</span>');
                    return `<span style="font-size:${state.ui.presenter.cardsFontLarge ? '1.25rem' : '1.05rem'};line-height:1.8;color:#1e293b;">${formatted}</span>`;
                }
                return '';
            }).join('');
        }
        function renderPresenterCards(storyIds) {
            const isLive = state.meta.isTXMode;
            const isRehearsal = state.meta.isRehearsalMode;
            const selfFire = state.ui.presenter.selfFireEnabled && state.ui.playoutBackend === 'radio' &&
                            (!state.localMode || !!state.radio.directoryHandle);
            const playingId = state.ui.presenter.playingClipStoryId || null;

            const activeIdx = storyIds.indexOf(state.meta.activeStoryId);
            const remaining = storyIds.slice(activeIdx > -1 ? activeIdx : 0)
                .reduce((s, id) => s + (state.storiesMap[id]?.duration || 0), 0);

            const expandedId = state.ui.presenter.expandedStoryId;

            const cards = storyIds.map((id, idx) => {
                const story = state.storiesMap[id];
                if (!story) return '';
                const isActive = state.meta.activeStoryId === id;
                const isPast = activeIdx > -1 && idx < activeIdx;
                const isNext = activeIdx > -1 && idx === activeIdx + 1;
                const isExpanded = expandedId === id;
                const clipSecs = parseClipTags(story.script);

                let cardStyle = 'bg-white border border-slate-200';
                let headerStyle = 'bg-slate-100 text-slate-600';
                if (isActive) {
                    cardStyle = `bg-white border-2 shadow-lg ${isLive ? 'border-red-500' : isRehearsal ? 'border-amber-500' : 'border-blue-500'}`;
                    headerStyle = isLive ? 'bg-red-600 text-white' : isRehearsal ? 'bg-amber-500 text-white' : 'bg-blue-600 text-white';
                } else if (isNext) {
                    cardStyle = 'bg-white border-2 border-blue-200 shadow-sm';
                    headerStyle = 'bg-blue-50 text-blue-800';
                } else if (isPast) {
                    cardStyle = 'bg-slate-50 border border-slate-100 opacity-40';
                    headerStyle = 'bg-slate-100 text-slate-400';
                }
                if (isExpanded) cardStyle += ' ring-2 ring-offset-1 ring-slate-400';

                return `
                    <div id="ref-story-${id}" class="rounded-xl overflow-hidden ${cardStyle} select-none">
                        <div class="px-4 py-3 min-h-[48px] flex items-center justify-between ${headerStyle} cursor-pointer"
                            data-action="ref-toggle-expand" data-id="${id}">
                            <div class="flex items-center gap-3">
                                <span class="font-black text-xs tracking-widest uppercase">${escapeHTML(story.format)}</span>
                                <span class="font-black text-base uppercase tracking-wide">${escapeHTML(story.slug)}</span>
                                ${isActive ? `<span class="text-xs font-bold opacity-75">● ON AIR</span>` : ''}
                                ${isNext ? `<span class="text-xs font-bold text-blue-600">NEXT</span>` : ''}
                            </div>
                            <div class="flex items-center gap-3 text-xs font-mono opacity-75">
                                ${clipSecs > 0 ? `<span class="bg-amber-500 text-white px-1.5 py-0.5 rounded text-[10px] font-bold">CLIP +${formatDuration(clipSecs)}</span>` : ''}
                                <span>${formatDuration(story.duration)}</span>
                                <span class="ml-1 opacity-60">${isExpanded ? '▲' : '▼'}</span>
                            </div>
                        </div>
                        ${isExpanded ? `
                        <div class="px-5 py-4 bg-white">
                            ${selfFire && story.mediaFile
                                ? renderPresenterScriptWithFire(story.script, id)
                                : `<p class="${state.ui.presenter.cardsFontLarge ? 'text-xl' : 'text-base'} text-slate-800 leading-relaxed whitespace-pre-wrap">${escapeHTML(story.script || 'No script.')}</p>`
                            }
                        </div>` : (isActive || isNext) ? `
                        <div class="px-4 py-2">
                            <p class="text-sm text-slate-500 leading-relaxed line-clamp-2 italic">${escapeHTML(story.script?.split('\n').find(l => l.trim()) || '')}</p>
                        </div>` : ''}
                    </div>`;
            }).join('');

            return `
                <div class="bg-slate-100 min-h-full">
                    ${state.meta.presenterAlert ? `
                    <div class="sticky top-0 z-10 bg-red-600 border-b-2 border-red-700 shadow-lg">
                        <div class="max-w-2xl mx-auto px-4 py-3 flex items-center gap-4">
                            <span class="w-3 h-3 rounded-full bg-white animate-pulse shrink-0"></span>
                            <span class="font-black text-white tracking-widest text-sm uppercase shrink-0">Producer</span>
                            <span class="text-white font-bold text-base leading-snug flex-1">${escapeHTML(state.meta.presenterAlert.text)}</span>
                            <button data-action="clear-presenter-alert"
                                class="shrink-0 px-4 py-2 min-h-[44px] bg-red-800 hover:bg-red-900 text-white text-xs font-black rounded-lg tracking-widest uppercase transition-colors">
                                ✕ Dismiss
                            </button>
                        </div>
                    </div>` : ''}
                    <div class="px-4 pb-8 max-w-2xl mx-auto">
                        <div class="py-4 flex items-center justify-between">
                            <span class="text-slate-500 text-sm font-bold uppercase tracking-widest">Running Order</span>
                            <div class="flex items-center gap-3">
                                <div class="text-right">
                                    <div class="text-xs text-slate-400 uppercase tracking-widest">Remaining</div>
                                    <div class="font-mono font-black text-2xl ${remaining < 120 ? 'text-red-600' : 'text-slate-800'}">${formatDuration(remaining)}</div>
                                </div>
                                <button data-action="presenter-toggle-font" title="Toggle script size"
                                    class="px-3 py-1.5 rounded-lg ${state.ui.presenter.cardsFontLarge ? 'bg-blue-600 text-white' : 'bg-slate-200 hover:bg-slate-300 text-slate-700'} text-sm transition-colors">
                                    <i class="fa-solid fa-text-height"></i>
                                </button>
                            </div>
                        </div>
                        <div class="flex flex-col gap-3">
                            ${cards}
                        </div>
                    </div>
                </div>`;
        }


        function renderModals() {
            if (state.ui.editingStoryId && !state.ui.pendingConflict) return renderEditModal();
            if (state.ui.isSettingsModalOpen) return renderSettingsModal();
            if (state.ui.isStaffModalOpen) return renderStaffModal();
            if (state.ui.pendingConflict) return renderConflictModal();
            return '';
        }

        /**
         * Renders the story edit modal. The modal container is NOT re-rendered
         * while it is open (guarded in render()) so background Firebase snapshots
         * cannot wipe unsaved content mid-edit. Shows a conflict resolution UI
         * instead if pendingConflict is set.
         * @returns {string} HTML string.
         */
        function renderEditModal() {
            const story = state.storiesMap[state.ui.editingStoryId];
            if (!story) return '';

            // Segment edit modal — minimal form, label + duration only
            if (story.type === 'segment') {
                const isLocked = story.lockedBySession && story.lockedBySession !== state.sessionId;
                return `<div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm flex flex-col overflow-hidden">
                        <div class="px-6 py-4 border-b border-indigo-100 flex justify-between items-center bg-indigo-50 rounded-t-2xl">
                            <h3 class="text-lg font-bold text-indigo-900"><i class="fa-solid fa-scissors mr-2 text-indigo-400"></i>Edit Segment</h3>
                            <button data-action="cancel-edit" class="text-indigo-300 hover:text-indigo-600 text-2xl"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="p-6 space-y-4">
                            <input type="hidden" id="edit-rev" value="${story.rev}">
                            <div>
                                <label class="text-sm font-semibold block mb-1">Label</label>
                                <input type="text" id="edit-slug" value="${escapeHTML(story.slug)}" class="w-full border rounded-lg px-4 py-2.5 outline-none focus:border-blue-500 font-bold uppercase tracking-widest" ${isLocked ? 'disabled' : ''} placeholder="e.g. SPORT, AD BREAK, WEATHER">
                            </div>
                            <div>
                                <label class="text-sm font-semibold block mb-1">Duration <span class="font-normal text-slate-400">(optional, counts toward TRT)</span></label>
                                <input type="text" id="edit-duration" value="${story.duration > 0 ? formatDuration(story.duration) : ''}" class="w-full border rounded-lg px-4 py-2 font-mono outline-none focus:border-blue-500" ${isLocked ? 'disabled' : ''} placeholder="e.g. 3:00">
                            </div>
                        </div>
                        <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-3">
                            <button data-action="cancel-edit" class="px-5 py-2.5 rounded-lg text-slate-600 hover:bg-slate-200 transition-colors">Cancel</button>
                            ${!isLocked ? `<button data-action="save-edit" class="btn-primary">Save</button>` : ''}
                        </div>
                    </div>
                </div>`;
            }

            const formats = state.meta.formats || DEFAULT_FORMATS;
            const formatOptions = formats.map(f => `<option value="${f}" ${story.format === f ? 'selected' : ''}>${f}</option>`).join('');
            const isLocked = story.lockedBySession && story.lockedBySession !== state.sessionId;
            const staffOptions = (selectedId, roleFilter = null) => `<option value="">-- Unassigned --</option>` + state.meta.staff.filter(s => roleFilter ? s.role === roleFilter : true).map(s => `<option value="${s.id}" ${s.id === selectedId ? 'selected' : ''}>${escapeHTML(s.name)} (${escapeHTML(s.role)})</option>`).join('');

            return `<div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl flex flex-col max-h-full overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50"><h3 class="text-xl font-bold text-slate-800"><i class="fa-solid fa-pen-to-square mr-2 text-blue-500"></i> Edit Story</h3><button data-action="cancel-edit" class="text-slate-400 hover:text-slate-600 text-2xl"><i class="fa-solid fa-xmark"></i></button></div>
                    ${isLocked ? (() => {
                        const lockAge = story.lockedAt ? Date.now() - story.lockedAt : STALE_LOCK_MS;
                        const isStale = lockAge >= STALE_LOCK_MS;
                        const waitSecs = isStale ? 0 : Math.ceil((STALE_LOCK_MS - lockAge) / 1000);
                        return `<div class="bg-amber-100 border-b border-amber-200 px-6 py-3 flex items-center justify-between">
                            <span class="text-amber-800 text-sm">Currently being edited by <strong>${escapeHTML(story.lockedByName)}</strong>.</span>
                            <button data-action="take-over-edit" id="takeover-btn" ${!isStale ? 'disabled' : ''}
                                class="text-xs ${isStale ? 'bg-amber-600 hover:bg-amber-700 text-white border-amber-700' : 'bg-white text-slate-400 border-slate-300 cursor-not-allowed'} border px-3 py-1.5 rounded shadow-sm font-bold transition-colors">
                                ${isStale ? 'Take Over' : `Wait ${waitSecs}s…`}
                            </button>
                        </div>`;
                    })() : ''}
                    <div class="p-6 overflow-y-auto flex-1 min-h-0 space-y-5">
                        <input type="hidden" id="edit-rev" value="${story.rev}">
                        <div class="grid grid-cols-1 gap-4 sm:grid-cols-4"><div class="sm:col-span-3"><label class="text-sm font-semibold block mb-1">Slug</label><input type="text" id="edit-slug" value="${escapeHTML(story.slug)}" class="w-full border rounded-lg px-4 py-2.5 outline-none focus:border-blue-500" ${isLocked ? 'disabled' : ''}></div><div class="sm:col-span-1"><label class="text-sm font-semibold block mb-1">Format</label><select id="edit-format" class="w-full border rounded-lg px-4 py-2.5 outline-none focus:border-blue-500" ${isLocked ? 'disabled' : ''}>${formatOptions}</select></div></div>
                        <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
                            <div><label class="text-sm font-semibold block mb-1">Presenter</label><select id="edit-presenter" class="w-full border rounded-lg px-4 py-2 outline-none focus:border-blue-500" ${isLocked ? 'disabled' : ''}>${staffOptions(story.presenterId, 'Presenter')}</select></div>
                            <div><label class="text-sm font-semibold block mb-1">Reporter</label><select id="edit-reporter" class="w-full border rounded-lg px-4 py-2 outline-none focus:border-blue-500" ${isLocked ? 'disabled' : ''}>${staffOptions(story.reporterId, 'Reporter')}</select></div>
                            <div>
                                <label class="text-sm font-semibold block mb-1">Duration
                                    <span class="font-normal text-slate-400 text-xs ml-1">(total)</span>
                                </label>
                                <input type="text" id="edit-duration" value="${formatDuration(story.duration)}" class="w-full border rounded-lg px-4 py-2 font-mono outline-none focus:border-blue-500" ${isLocked ? 'disabled' : ''} placeholder="e.g. 02:15" title="Total duration — auto-estimated from script. Edit manually to override.">
                                <div id="edit-dur-breakdown" class="text-xs font-mono mt-1 ${parseClipTags(story.script) > 0 ? 'text-amber-600' : 'text-slate-400'}">
                                    ${(()=>{
                                        const clip = parseClipTags(story.script);
                                        const read = Math.max(0, story.duration - clip);
                                        if (clip > 0) return '~' + formatDuration(read) + ' read + ' + formatDuration(clip) + ' clip';
                                        if (story.duration > 0) return 'Estimated from script';
                                        return '';
                                    })()}
                                </div>
                            </div>
                        </div>
                        <div><label class="text-sm font-semibold block mb-1">Media File</label><div class="flex gap-2"><input type="text" id="edit-media-file" value="${escapeHTML(story.mediaFile || '')}" class="flex-1 border rounded-lg px-4 py-2 font-mono outline-none focus:border-blue-500" ${isLocked ? 'disabled' : ''}><button data-action="browse-media" class="px-4 py-2 bg-slate-100 border rounded-lg text-sm font-medium hover:bg-slate-200" ${isLocked ? 'disabled' : ''}>Browse</button><input type="file" id="media-file-picker" class="hidden"></div></div>
                        <div class="flex flex-col min-h-[12rem] md:h-64">
                            <div class="flex items-baseline justify-between mb-1">
                                <label class="text-sm font-semibold">Presenter Script</label>
                                <span id="edit-script-stats" class="text-xs font-mono text-slate-400">
                                    ${(()=>{
                                        const stripped = (story.script||'').replace(/\[[^\]]*\]/g,' ').replace(/\s+/g,' ').trim();
                                        const w = stripped.length > 0 ? stripped.split(' ').filter(Boolean).length : 0;
                                        const s = Math.round(w / 2.8);
                                        return w > 0 ? `${w} words \u00b7 ~${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')} read` : '';
                                    })()}
                                </span>
                            </div>
                            <textarea id="edit-script" class="w-full flex-1 border rounded-lg p-4 outline-none focus:border-blue-500 resize-none text-lg" ${isLocked ? 'disabled' : ''}
                                oninput="window._moiraUpdateScriptStats(this)"
                            >${escapeHTML(story.script)}</textarea>
                        </div>
                    </div>
                    <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-between items-center gap-3"><div>${state.ui.storySnapshots[state.ui.editingStoryId] ? `<button data-action="revert-story" data-id="${state.ui.editingStoryId}" class="flex items-center gap-2 px-4 py-2.5 rounded-lg text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 font-medium transition-colors text-sm"><i class="fa-solid fa-clock-rotate-left"></i>Revert to previous version</button>` : ''}</div><div class="flex gap-3"><button data-action="cancel-edit" class="px-5 py-2.5 rounded-lg text-slate-600 hover:bg-slate-200 transition-colors">${isLocked ? 'Close' : 'Cancel'}</button>${!isLocked ? `<button data-action="save-edit" class="btn-primary">Save Changes</button>` : ''}</div></div>
                </div>
            </div>`;
        }

        /**
         * Renders the settings modal with three tabs: Connection (Firebase config),
         * Playout (backend selector, OBS config, radio output device and media
         * folder), and Editorial (TX/RX clock times, story formats, staff roles,
         * rundown lock). Settings are persisted to localStorage on save.
         * @returns {string} HTML string.
         */
        function renderSettingsModal() {
            let savedConfig = {};
            try {
                const str = localStorage.getItem('moira_firebase_config');
                if (str) savedConfig = JSON.parse(str);
            } catch(e) {}
            
            const currentFormats = (state.meta.formats || DEFAULT_FORMATS).join('\n');
            const currentRoles = (state.meta.roles || DEFAULT_ROLES).join('\n');

            const tabBtn = (id, label, icon) => `
                <button data-action="set-settings-tab" data-val="${id}" class="flex-1 py-3 text-sm font-bold border-b-2 transition-colors flex items-center justify-center gap-2 ${state.ui.settingsTab === id ? 'border-blue-600 text-blue-600 bg-blue-50/50' : 'border-slate-200 text-slate-400 hover:text-slate-600'}">
                    <i class="fa-solid ${icon}"></i><span class="hidden md:inline ml-2">${label}</span>
                </button>
            `;

            return `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-[70]">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl flex flex-col max-h-[85vh]">
                        <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                            <h3 class="text-xl font-bold text-slate-800"><i class="fa-solid fa-gear mr-2 text-slate-500"></i> System Settings</h3>
                            <button data-action="close-settings-modal" class="text-slate-400 hover:text-slate-600 text-2xl"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="flex">
                            ${tabBtn('connection', 'Connection', 'fa-network-wired')}
                            ${tabBtn('editorial', 'Editorial', 'fa-pen-nib')}
                            ${tabBtn('playout', 'Playout', 'fa-film')}
                            ${tabBtn('about', 'About', 'fa-info-circle')}
                            ${tabBtn('reset', 'Reset', 'fa-triangle-exclamation')}
                        </div>
                        <div class="p-6 overflow-y-auto flex-1 min-h-0">
                            ${state.ui.settingsTab === 'connection' ? `
                                <div class="space-y-6">
                                    <div class="bg-blue-50 border border-blue-200 rounded-xl p-4">
                                        <div class="flex justify-between items-start mb-2"><h4 class="font-bold text-blue-800">Cloud Sync</h4>${state.connectionState === 'connected' ? `<span class="text-[10px] font-bold uppercase tracking-wider bg-emerald-500 text-white px-2 py-1 rounded-md shadow-sm">Connected</span>` : ''}</div>
                                        <textarea id="config-paste" rows="4" class="w-full border rounded-lg p-3 text-xs font-mono bg-white outline-none mb-4" placeholder="const firebaseConfig = { ... }"></textarea>
                                        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                                            <div><label class="form-label-sm">apiKey</label><input type="text" id="config-apikey" value="${escapeHTML(savedConfig.apiKey || '')}" class="form-input-sm"></div>
                                            <div><label class="form-label-sm">authDomain</label><input type="text" id="config-authdomain" value="${escapeHTML(savedConfig.authDomain || '')}" class="form-input-sm"></div>
                                            <div><label class="form-label-sm">projectId</label><input type="text" id="config-projectid" value="${escapeHTML(savedConfig.projectId || '')}" class="form-input-sm"></div>
                                            <div><label class="form-label-sm">storageBucket</label><input type="text" id="config-storagebucket" value="${escapeHTML(savedConfig.storageBucket || '')}" class="form-input-sm"></div>
                                        </div>
                                    </div>
                                </div>` 
                            : state.ui.settingsTab === 'editorial' ? `
                                <div class="space-y-6">
                                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
                                        <h4 class="font-bold text-slate-800 mb-2">Story Formats</h4>
                                        <textarea id="settings-formats-input" rows="5" class="w-full border rounded-lg p-4 text-sm font-mono outline-none mb-6">${escapeHTML(currentFormats)}</textarea>
                                        <h4 class="font-bold text-slate-800 mb-2">Staff Roles</h4>
                                        <textarea id="settings-roles-input" rows="5" class="w-full border rounded-lg p-4 text-sm font-mono outline-none">${escapeHTML(currentRoles)}</textarea>
                                    </div>
                                </div>`
                           : state.ui.settingsTab === 'playout' ? `
                                <div class="space-y-4">

                                    <!-- Backend selector -->
                                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-5">
                                        <h4 class="font-bold text-slate-800 text-sm mb-3">Playout Backend</h4>
                                        <div class="flex bg-slate-200 p-1 rounded-lg gap-1">
                                            <button data-action="set-playout-backend" data-val="none"
                                                class="flex-1 py-2 rounded-md text-sm font-bold transition-colors ${state.ui.playoutBackend === 'none' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}">
                                                <i class="fa-solid fa-newspaper mr-1.5"></i>No Playout
                                            </button>
                                            <button data-action="set-playout-backend" data-val="radio"
                                                class="flex-1 py-2 rounded-md text-sm font-bold transition-colors ${state.ui.playoutBackend === 'radio' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}">
                                                <i class="fa-solid fa-radio mr-1.5"></i>Radio
                                            </button>
                                            <button data-action="set-playout-backend" data-val="obs"
                                                class="flex-1 py-2 rounded-md text-sm font-bold transition-colors ${state.ui.playoutBackend === 'obs' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}">
                                                <i class="fa-solid fa-film mr-1.5"></i>OBS
                                            </button>
                                        </div>
                                        ${state.ui.playoutBackend === 'none' ? `
                                        <p class="text-xs text-slate-400 mt-3 leading-relaxed">Moira will operate as a pure NRCS. No playout controls will appear in the Studio view. Story media file fields are still available for reference.</p>
                                        ` : ''}
                                    </div>

                                    <!-- Radio config — only shown when radio is selected -->
                                    ${state.ui.playoutBackend === 'radio' ? `
                                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-4">
                                        <h4 class="font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-radio text-slate-400"></i>Audio Output Device</h4>
                                        ${setSinkIdSupported ? `
                                        <div>
                                            <label class="form-label">Output Device</label>
                                            <select id="radio-sink-select" class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500 bg-white">
                                                <option value="">System Default</option>
                                                ${(state.radio.devices || []).map(d =>
                                                    `<option value="${escapeHTML(d.deviceId)}" ${state.radio.selectedSinkId === d.deviceId ? 'selected' : ''}>${escapeHTML(d.label || d.deviceId.slice(0, 20))}</option>`
                                                ).join('')}
                                            </select>
                                            <p class="text-xs text-slate-400 mt-1">Selects which audio output device the browser routes audio to.</p>
                                        </div>
                                        ` : `
                                        <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-sm text-amber-800">
                                            <strong>Output device selection is not available in this browser.</strong><br>
                                            Audio will route to the system default output. Use a virtual audio router such as Loopback or BlackHole to direct it to your broadcast device.
                                        </div>
                                        `}
                                    </div>
                                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-3">
                                        <h4 class="font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-folder-open text-slate-400"></i>Media Folder</h4>
                                        <p class="text-xs text-slate-500 leading-relaxed">Grant Moira access to your clips folder once per session. Clips will be loaded automatically from the running order on TX start.</p>
                                        ${state.radio.directoryHandle ? `
                                        <div class="flex items-center gap-3 bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2">
                                            <i class="fa-solid fa-circle-check text-emerald-500 text-sm"></i>
                                            <span class="text-sm font-medium text-emerald-800 truncate">${escapeHTML(state.radio.directoryHandle.name)}</span>
                                            <button data-action="revoke-media-folder" class="ml-auto text-xs text-slate-400 hover:text-red-500 transition-colors font-mono shrink-0">✕ Revoke</button>
                                        </div>
                                        ` : state.ui.mediaFolderPendingHandle ? `
                                        <div class="flex items-center gap-3 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
                                            <i class="fa-solid fa-folder text-amber-500 text-sm"></i>
                                            <span class="text-sm font-medium text-amber-800 truncate">${escapeHTML(state.ui.mediaFolderPendingHandle.name)}</span>
                                            <button data-action="restore-media-folder" class="ml-auto text-xs font-bold px-2.5 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded shrink-0 transition-colors">↺ Re-grant</button>
                                            <button data-action="revoke-media-folder" class="text-xs text-slate-400 hover:text-red-500 transition-colors font-mono shrink-0">✕</button>
                                        </div>
                                        <p class="text-xs text-amber-600 font-medium"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Tap Re-grant to restore access without choosing the folder again.</p>
                                        ` : `
                                        <button data-action="grant-media-folder" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors">
                                            <i class="fa-solid fa-folder-open"></i> Grant Media Folder Access
                                        </button>
                                        <p class="text-xs text-slate-400">No folder granted — clips must be loaded manually onto each deck.</p>
                                        `}
                                    </div>
                                    ` : ''}

                                    <!-- Presenter Self-Fire — only when radio is selected -->
                                    ${state.ui.playoutBackend === 'radio' ? `
                                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-3">
                                        <h4 class="font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-microphone text-slate-400"></i>Presenter Clip Fire</h4>
                                        <p class="text-xs text-slate-500 leading-relaxed">When enabled, [CLIP] tags in expanded presenter cards become tap-to-play buttons. Uses the same audio output and media folder as the main playout system.</p>
                                        <div class="flex items-center justify-between">
                                            <span class="text-sm font-medium text-slate-700">Allow presenter to fire clips</span>
                                            <button data-action="toggle-presenter-self-fire"
                                                class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${state.ui.presenter.selfFireEnabled ? 'bg-blue-600' : 'bg-slate-200'}">
                                                <span class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform ${state.ui.presenter.selfFireEnabled ? 'translate-x-6' : 'translate-x-1'}"></span>
                                            </button>
                                        </div>
                                        ${state.ui.presenter.selfFireEnabled && state.localMode && !state.radio.directoryHandle ? `
                                        <p class="text-xs text-amber-600 font-medium"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Grant a media folder above for self-fire to work.</p>` : ''}
                                    </div>
                                    ` : ''}

                                    <!-- OBS config — only shown when OBS is selected -->
                                    ${state.ui.playoutBackend === 'obs' ? `
                                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-4">
                                        <h4 class="font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-film text-slate-400"></i>OBS WebSocket Connection</h4>
                                        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                                            <div>
                                                <label class="form-label">IP Address</label>
                                                <input type="text" id="obs-set-ip" value="${escapeHTML(OBS.getConfig().ip)}" placeholder="127.0.0.1" class="form-input">
                                            </div>
                                            <div>
                                                <label class="form-label">Port</label>
                                                <input type="number" id="obs-set-port" value="${escapeHTML(OBS.getConfig().port)}" placeholder="4455" class="form-input">
                                            </div>
                                            <div>
                                                <label class="form-label">WebSocket Password</label>
                                                <input type="password" id="obs-set-pass" value="${escapeHTML(OBS.getConfig().pass)}" class="form-input">
                                            </div>
                                            <div>
                                                <label class="form-label">Base Media Folder</label>
                                                <input type="text" id="obs-set-base" value="${escapeHTML(OBS.getConfig().base)}" placeholder="D:/Broadcast/Clips/" class="form-input">
                                                <p class="text-xs text-slate-400 mt-1">Include trailing slash. Prepended to all media filenames.</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-sm text-blue-800">
                                        <strong>Expected OBS scene structure:</strong> Scenes named <code class="bg-blue-100 px-1 rounded">VT A</code>, <code class="bg-blue-100 px-1 rounded">VT B</code>, and <code class="bg-blue-100 px-1 rounded">Lower Third</code>. Moira will auto-create these on connect if they don't exist.
                                    </div>
                                    ` : ''}

                                </div>`
                            : state.ui.settingsTab === 'reset' ? `
                                <div class="space-y-6">
                                    <div class="bg-red-50 border border-red-200 rounded-xl p-6">
                                        <div class="flex items-center gap-3 mb-4">
                                            <div class="w-10 h-10 bg-red-100 text-red-600 rounded-full flex items-center justify-center"><i class="fa-solid fa-triangle-exclamation"></i></div>
                                            <h4 class="font-bold text-red-800 text-lg">Factory Reset</h4>
                                        </div>
                                        <p class="text-sm text-red-700 mb-6">This will permanently clear all local data including your newsroom, bulletin, staff identity, and Firebase configuration. The page will reload to a clean state.</p>
                                        <button data-action="factory-reset" class="w-full px-4 py-3 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-bold transition-colors shadow-sm flex items-center justify-center gap-2">
                                            <i class="fa-solid fa-skull"></i> Nuke Everything &amp; Reset
                                        </button>
                                    </div>
                                </div>`
                            : `
                                <div class="p-4 space-y-6 text-center">
                                    <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-satellite-dish text-3xl"></i></div>
                                    <h4 class="text-2xl font-bold text-slate-800">Moira</h4>
                                    <p class="text-sm text-slate-500 font-medium tracking-tight">A lightweight broadcast bulletin management system designed for small newsrooms</p>
                                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-6 text-center">
                                        <p class="text-slate-700 mb-4 leading-relaxed"><strong>Moira - Bulletin Manager</strong> is developed by <span class="text-slate-900 font-bold">Andy Dickinson</span> and is free and open source.</p>
                                        <div class="h-px bg-slate-200 w-12 mx-auto mb-4"></div>
                                        <p class="text-sm text-slate-500">It's named after BBC legend <a href="https://en.wikipedia.org/wiki/Moira_Stuart" target="_blank" class="text-blue-500 hover:underline font-bold decoration-2 underline-offset-2">Moira Stuart</a>.</p>
                                    </div>
                                    <div class="text-center text-[10px] text-slate-400 font-mono uppercase tracking-widest">v2.7.0</div>
                                </div>`}
                        </div>
                        <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 rounded-b-2xl flex justify-between items-center">
                            <div>
                                ${state.ui.settingsTab === 'connection' ? `<button data-action="clear-settings" class="px-4 py-2 rounded-lg text-red-600 font-medium hover:bg-red-50" title="Remove Firebase config and work offline">Disconnect Firebase</button>` : ''}
                                ${state.ui.settingsTab === 'playout' && state.ui.playoutBackend === 'obs' ? `<button data-action="obs-disconnect" class="px-4 py-2 rounded-lg text-red-600 font-medium hover:bg-red-50">Disconnect OBS</button>` : ''}
                                </div>
                            <button data-action="close-settings-modal" class="px-5 py-2.5 rounded-lg text-slate-600 hover:bg-slate-200">Close</button>
                            <div>
                                ${state.ui.settingsTab === 'connection' ? `<button data-action="save-settings" class="btn-primary">Save & Restart</button>` : ''}
                                ${state.ui.settingsTab === 'playout' && state.ui.playoutBackend === 'obs' ? `<button data-action="save-obs-settings" class="btn-primary">Save & Reconnect OBS</button>` : ''}
                                ${state.ui.settingsTab === 'playout' && state.ui.playoutBackend === 'radio' ? `<button data-action="save-radio-settings" class="btn-primary">Save Audio Settings</button>` : ''}
                                ${state.ui.settingsTab === 'editorial' ? `<button data-action="save-editorial-settings" class="btn-primary">Apply to Newsroom</button>` : ''}
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function renderStaffModal() {
            const now = Date.now();
            const ACTIVE_THRESHOLD = 2 * 60 * 1000;

            const staffRows = (state.meta.staff || []).map(s => {
                const isMe = s.id === state.myStaffId;
                const isEditor = s.id === state.meta.editorStaffId;
                const isActive = s.lastSeen && (now - s.lastSeen) < ACTIVE_THRESHOLD;
                const isCheckedIn = s.checkedIn;

                let presenceDot, presenceLabel;
                if (isActive) {
                    presenceDot = `<span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_4px_#10b981] shrink-0"></span>`;
                    presenceLabel = `<span class="text-[10px] text-emerald-600 font-bold">Online</span>`;
                } else if (isCheckedIn) {
                    presenceDot = `<span class="w-2.5 h-2.5 rounded-full bg-amber-400 shrink-0"></span>`;
                    presenceLabel = `<span class="text-[10px] text-amber-600 font-bold">Away</span>`;
                } else {
                    presenceDot = `<span class="w-2.5 h-2.5 rounded-full bg-slate-300 border border-slate-400 shrink-0"></span>`;
                    presenceLabel = `<span class="text-[10px] text-slate-400">Off duty</span>`;
                }

                return `
                    <div class="flex items-center justify-between px-3 py-2.5 rounded-xl border ${isMe ? 'bg-blue-50 border-blue-200' : 'bg-white border-slate-200'}">
                        <div class="flex items-center gap-2.5 min-w-0">
                            ${presenceDot}
                            <div class="min-w-0">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="font-bold text-sm ${isMe ? 'text-blue-800' : 'text-slate-800'}">${escapeHTML(s.name)}</span>
                                    <select data-action="change-role" data-id="${s.id}"
                                        class="text-xs text-slate-600 bg-slate-100 border-0 rounded px-1.5 py-0.5 font-medium outline-none focus:ring-1 focus:ring-blue-400 cursor-pointer">
                                        ${(state.meta.roles || DEFAULT_ROLES).map(r => `<option value="${r}" ${r === s.role ? 'selected' : ''}>${r}</option>`).join('')}
                                    </select>
                                    ${isEditor ? `<span class="text-[10px] bg-amber-400 text-amber-900 px-1.5 py-0.5 rounded font-black uppercase tracking-wide">Editor</span>` : ''}
                                    ${isMe ? `<span class="text-[10px] bg-blue-200 text-blue-800 px-1.5 py-0.5 rounded font-bold italic">You</span>` : ''}
                                </div>
                                ${presenceLabel}
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0 ml-3">
                            ${!isMe ? `<button data-action="check-in" data-id="${s.id}" class="text-[10px] uppercase font-bold bg-white border border-slate-300 hover:border-blue-400 hover:text-blue-600 px-2 py-1 rounded transition-colors">That's me</button>` : ''}
                            ${isMe ? `<button data-action="check-out" data-id="${s.id}" class="text-[10px] uppercase font-bold bg-white border border-blue-200 hover:border-red-300 text-blue-500 hover:text-red-500 px-2 py-1 rounded transition-colors">Not me</button>` : ''}
                            ${isMe ? `<button data-action="set-editor" data-id="${s.id}" title="${isEditor ? 'Remove editor role' : 'Make me editor'}" class="text-[10px] uppercase font-bold px-2 py-1 rounded border transition-colors ${isEditor ? 'bg-amber-100 border-amber-300 text-amber-700 hover:bg-amber-200' : 'bg-white border-slate-200 text-slate-400 hover:border-amber-300 hover:text-amber-600'}"><i class="fa-solid fa-star mr-0.5"></i>${isEditor ? 'Editor' : 'Be Editor'}</button>` : ''}
                            <button data-action="remove-staff" data-id="${s.id}" class="w-6 h-6 flex items-center justify-center text-slate-300 hover:text-red-500 transition-colors rounded"><i class="fa-solid fa-xmark text-xs"></i></button>
                        </div>
                    </div>`;
            }).join('');

            const roleOptions = (state.meta.roles || DEFAULT_ROLES).map(r => `<option value="${r}">${r}</option>`).join('');
